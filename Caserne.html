<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    width: 100%;
    height: 100%;
}

#screen {
    width: 100vw;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    overflow: visible;
}

/* Position finale validée */
#sopfeu-widget-container {
    margin-top: 100px;
    transform: scale(2.40);
    transform-origin: top center;
}
</style>

</head>

<body>

<div id="screen">

    <div
        id="sopfeu-widget-container"
        data-sopfeu-lng="fr_CA"
        data-sopfeu-media="20"
        data-sopfeu-responsive="false">
    </div>

</div>

<script src="https://www.sopfeu.qc.ca/sopfeu-widget.js"></script>

</body>
</html>
